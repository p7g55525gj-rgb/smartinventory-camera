<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>SmartInventory — JANコード読取</title>
  <style>
    :root { color: #24322a; font-family: system-ui, -apple-system, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    body { background: #f6faf6; }
    main { box-sizing: border-box; height: 100dvh; overflow: hidden; padding: clamp(24px, 7vw, 80px); background: #fff; }
    h1 { margin: 0; font-size: 1.4rem; } p { color: #526159; line-height: 1.6; }
    button { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 9px; background: #23734d; color: #fff; font: inherit; font-weight: 700; touch-action: manipulation; }
    button.secondary { display: none; background: #6b5142; }
    #scanner { display: none; overflow: hidden; margin-top: 16px; border-radius: 10px; background: #111; }
    #scanner video, #scanner canvas { width: 100%; height: auto; }
    #status { min-height: 2em; font-weight: 700; }
    .note { margin-top: 24px; padding-top: 16px; border-top: 1px solid #dce7de; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>JANコードを読み取る</h1>
    <p>カメラの利用を許可し、商品のバーコード全体を映してください。</p>
    <button id="start" type="button">カメラを起動する</button>
    <button id="stop" class="secondary" type="button">読み取りをやめる</button>
    <div id="scanner" aria-label="バーコード読み取りカメラ"></div>
    <p id="status" role="status">準備ができました。</p>
    <p class="note">このページはJANコードを読み取るだけです。在庫データやGoogleスプレッドシートにはアクセスしません。</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
  <script>
    const scanner = document.getElementById('scanner');
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');
    const status = document.getElementById('status');
    const returnOrigin = new URLSearchParams(window.location.search).get('returnOrigin');
    const returnUrl = new URLSearchParams(window.location.search).get('returnUrl');
    let isScanning = false;

    function setControls(scanning) {
      startButton.style.display = scanning ? 'none' : 'block';
      stopButton.style.display = scanning ? 'block' : 'none';
      scanner.style.display = scanning ? 'block' : 'none';
    }

    function stopScanner() {
      if (isScanning) {
        Quagga.stop();
        isScanning = false;
      }
      scanner.innerHTML = '';
      setControls(false);
    }

    function getReturnUrl(code) {
      if (!returnUrl) return null;
      try {
        const target = new URL(returnUrl);
        const isSmartInventoryUrl = target.origin === 'https://script.google.com'
          && /^\/macros\/s\/[^/]+\/exec$/.test(target.pathname);
        if (!isSmartInventoryUrl) return null;
        target.searchParams.set('scannedJan', code);
        return target.toString();
      } catch (_) {
        return null;
      }
    }

    function cameraErrorMessage(error) {
      const errorName = error && error.name ? error.name : '';
      if (errorName === 'NotAllowedError' || errorName === 'PermissionDeniedError') {
        return 'カメラの利用が許可されていません。ブラウザのアドレスバーの鍵アイコン、またはスマホの設定から、このサイトのカメラを「許可」にしてから再度お試しください。';
      }
      if (errorName === 'NotFoundError') {
        return '使用できるカメラが見つかりませんでした。カメラ搭載端末でお試しください。';
      }
      return 'カメラを起動できませんでした：' + ((error && error.message) || error || '不明なエラー');
    }

    async function getCameraPermissionState() {
      if (!navigator.permissions || !navigator.permissions.query) return 'prompt';
      try {
        return (await navigator.permissions.query({ name: 'camera' })).state;
      } catch (_) {
        return 'prompt';
      }
    }

    async function confirmCameraPermission() {
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('このブラウザではカメラを安全に利用できません。最新版のChromeまたはSafariでお試しください。');
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      stream.getTracks().forEach((track) => track.stop());
    }

    function sendBarcode(code) {
      const fallbackUrl = getReturnUrl(code);
      let sentToOpener = false;

      if (returnOrigin && window.opener) {
        try {
          window.opener.postMessage({ type: 'smartinventory:barcode', code: code }, returnOrigin);
          sentToOpener = true;
        } catch (_) {
          sentToOpener = false;
        }
      }

      if (sentToOpener) {
        status.textContent = '読み取りました。元のSmartInventory画面へ自動で戻ります。';
        window.setTimeout(() => window.close(), 100);
        if (fallbackUrl) {
          window.setTimeout(() => window.location.replace(fallbackUrl), 1000);
        }
        return;
      }

      if (fallbackUrl) {
        status.textContent = '読み取りました。SmartInventory画面へ戻ります。';
        window.setTimeout(() => window.location.replace(fallbackUrl), 300);
        return;
      }

      status.textContent = '読み取りました：' + code + '。元のSmartInventory画面からもう一度開いてください。';
    }

    function handleDetected(result) {
      if (!isScanning || !result.codeResult || !result.codeResult.code) return;
      const code = result.codeResult.code;
      stopScanner();
      sendBarcode(code);
    }

    startButton.addEventListener('click', async () => {
      if (!window.Quagga) {
        status.textContent = '読取機能を読み込めませんでした。通信状態を確認してください。';
        return;
      }

      try {
        const permissionState = await getCameraPermissionState();
        if (permissionState !== 'granted') {
          status.textContent = 'カメラの利用許可を確認しています。';
          await confirmCameraPermission();
        }
        status.textContent = 'カメラを起動しています。';

        Quagga.init({
          inputStream: {
            type: 'LiveStream',
            target: scanner,
            constraints: { facingMode: { ideal: 'environment' } }
          },
          locator: { patchSize: 'medium', halfSample: true },
          decoder: { readers: ['ean_reader', 'ean_8_reader'] },
          locate: true
        }, (error) => {
          if (error) {
            status.textContent = cameraErrorMessage(error);
            return;
          }
          isScanning = true;
          setControls(true);
          Quagga.start();
          status.textContent = 'バーコードを枠内に映してください。';
        });
      } catch (error) {
        status.textContent = cameraErrorMessage(error);
      }
    });

    stopButton.addEventListener('click', () => {
      stopScanner();
      status.textContent = '読み取りを停止しました。';
    });

    if (window.Quagga) Quagga.onDetected(handleDetected);
  </script>
</body>
</html>
